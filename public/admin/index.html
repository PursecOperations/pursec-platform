<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PURSEC — Panel</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<noscript><p style="padding:24px">Este panel necesita JavaScript.</p></noscript>

<!-- Acceso: la página no contiene ningún dato. Los datos solo llegan del servidor tras validar el enlace mágico. -->
<section id="login" class="login" hidden aria-labelledby="login-title">
  <div class="login-card">
    <img class="login-logo" src="/img/brand/pursec-white.svg" width="1612" height="403" alt="PURSEC">
    <h1 id="login-title" class="login-title">Panel privado</h1>
    <p class="mute login-sub">Introduce tu email de administrador y te enviamos un enlace de acceso. Sin contraseña.</p>
    <form id="login-form" novalidate>
      <label class="sr" for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="email" inputmode="email" placeholder="Email de administrador" required>
      <button class="btn" type="submit" id="login-btn">Enviar enlace</button>
      <p id="login-msg" class="login-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

<div id="app" class="app" hidden>
  <aside class="side" id="side" aria-label="Navegación">
    <a class="side-brand" href="#/overview" aria-label="PURSEC — resumen"><img src="/img/brand/pursec-white.svg" width="1612" height="403" alt="PURSEC"></a>
    <nav id="nav" class="nav"></nav>
    <div class="side-foot">
      <span class="mono mute" id="who"></span>
      <button class="link-btn" id="logout" type="button">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menu" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="side">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="title" class="page-title">Resumen</h1>
      <span class="spacer"></span>
      <span id="mode" class="pill" hidden></span>
      <span id="updated" class="mono mute updated"></span>
      <button class="btn-sm" id="refresh" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        <span>Actualizar</span>
      </button>
    </header>
    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
  </div>
  <div class="scrim" id="scrim" hidden></div>
</div>

<aside id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <h2 id="drawer-title">Pedido</h2>
    <button class="icon-btn" id="drawer-close" type="button" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<div id="tip" class="tip" role="presentation" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/admin/admin.js" defer></script>
</body>
</html>
