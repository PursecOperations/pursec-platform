<!doctype html>
<html lang="es" data-tier="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PURSEC — Garage</title>
<meta name="description" content="El Garage de PURSEC: Race Weekend y Sector 4 en una sola pantalla.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050409">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/img/ps-emblema-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/pursec.css">
<link rel="stylesheet" href="/css/garage.css">
</head>
<body class="garage">
<div class="gate" aria-hidden="true"><span class="sg"><i></i><i></i><i></i></span></div>

<div class="app" id="app">
  <header class="g-top">
    <button class="g-burger" type="button" id="burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="side"><i></i><i></i></button>
    <a class="g-brand" href="/" aria-label="PURSEC, portada"><img src="/img/ps-emblema.webp" alt="" width="36" height="36"><span><b>PURSEC</b><small>Garage</small></span></a>

    <label class="g-race">
      <span class="sr">Carrera</span>
      <select id="race" aria-label="Carrera"><option>Cargando calendario…</option></select>
    </label>

    <div class="g-acc">
      <span class="plan-chip" data-acc-plan>…</span>
      <button class="g-out" type="button" data-signout>Salir</button>
    </div>
  </header>

  <nav class="g-side" id="side" aria-label="Garage">
    <div class="g-group">
      <p class="g-gl">Race Weekend</p>
      <a href="#weekend-brief" data-id="weekend-brief"><span>Weekend Brief</span><em>Jue</em></a>
      <a href="#race-card" data-id="race-card"><span>Race Card</span><em>Sáb</em></a>
      <a href="#sprint-card" data-id="sprint-card"><span>Sprint Card</span><em>Sprint</em></a>
      <a href="#debrief" data-id="debrief"><span>Debrief</span><em>Lun</em></a>
    </div>
    <div class="g-group">
      <p class="g-gl s4l">Sector 4 <span class="sg" aria-hidden="true"><i></i><i></i><i></i></span></p>
      <a href="#rewind" data-id="rewind"><span>Rewind</span></a>
      <a href="#undercut-duel" data-id="undercut-duel"><span>Undercut Duel</span></a>
      <a href="#sc-window" data-id="sc-window"><span>SC Window</span></a>
      <a href="#deg-curve" data-id="deg-curve"><span>Deg Curve</span></a>
      <a href="#head-2-head" data-id="head-2-head"><span>Head 2 Head</span></a>
      <a href="#title-fight" data-id="title-fight"><span>Title Fight</span></a>
    </div>
    <div class="g-group soon">
      <p class="g-gl">Soon</p>
      <span class="off">Content</span><span class="off">Social</span><span class="off">Community</span><span class="off">Club</span>
    </div>
    <div class="g-group g-foot">
      <a href="#membership" data-id="membership"><span>Membership</span></a>
      <a href="#pit-radio" data-id="pit-radio"><span>Pit Radio</span></a>
      <a href="/legal" class="ext"><span>Legal y privacidad</span></a>
    </div>
  </nav>
  <div class="g-scrim" id="scrim" hidden></div>

  <main class="g-stage" id="stage" tabindex="-1" aria-live="polite"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="/js/pursec-auth.js"></script>
<script src="/js/garage-data.js"></script>
<script type="module" src="/js/garage.js"></script>
</body>
</html>
