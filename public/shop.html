<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop — PURSEC</title>
<meta name="description" content="All PURSEC pieces. Free shipping from €70 to Spain, France, Germany, Italy and Portugal.">
<meta name="theme-color" content="#040207">
<meta property="og:image" content="https://pursec.club/img/brand/og.jpg">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="shop">
<div data-header></div>
<main id="main">
  <section class="page-hero" aria-labelledby="t">
    <span class="mono lilac">Drop 01</span>
    <h1 class="display" id="t" style="font-size:clamp(48px,11vw,160px);margin-top:12px"><span class="clip in"><span>Shop</span></span></h1>
  </section>
  <section class="sec light" style="padding-top:28px" aria-label="Products">
    <div class="toolbar">
      <div class="pills" id="pills" role="group" aria-label="Filter by category"></div>
      <div style="display:flex;gap:14px;align-items:center">
        <span class="mono" id="shop-info" style="color:var(--mute-l)" aria-live="polite"></span>
        <label class="sr" for="sort">Sort</label>
        <select class="select" id="sort"><option value="featured">Featured</option><option value="new">Newest</option><option value="price-asc">Price, low to high</option><option value="price-desc">Price, high to low</option></select>
      </div>
    </div>
    <div class="grid" id="shop-grid"></div>
  </section>
  <section class="sec list" aria-labelledby="lt" style="padding-block:clamp(56px,8vw,110px)">
    <div class="inner">
      <h2 class="h2" id="lt" style="font-size:clamp(28px,4.4vw,60px)">Don't miss the drop</h2>
      <form data-waitlist="web-shop" style="display:contents" novalidate>
        <div class="field"><label class="sr" for="em">Email</label><input id="em" type="email" required autocomplete="email" placeholder="Your email"><button class="btn" type="submit">Join</button></div>
        <label class="consent"><input type="checkbox" required><span>I agree to receive emails about PURSEC drops and accept the <a href="/legal#privacy">privacy policy</a>.</span></label>
        <p class="form-msg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>
<div data-footer></div>
<script src="/assets/site.js" defer></script>
</body>
</html>
