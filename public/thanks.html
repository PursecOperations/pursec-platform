<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order received — PURSEC</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#040207">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="thanks">
<div data-header></div>
<main id="main">
  <section class="hero" style="min-height:calc(100svh - 96px)">
    <div class="center" style="padding:40px var(--g);text-align:center;max-width:720px">
      <img src="/img/brand/logo-mark.webp" width="851" height="214" alt="" style="width:min(360px,70vw);height:auto;filter:drop-shadow(0 0 30px rgba(168,85,247,.45))">
      <span class="kicker mono" style="animation-delay:.2s"><span class="dot"></span><span id="state">Checking your order…</span></span>
      <h1 class="h2" id="title" style="font-size:clamp(36px,7vw,84px)">Order received.</h1>
      <p class="mute" id="text" style="margin:0;max-width:520px">We're packing your order. You'll get an email with the tracking link as soon as it ships, within 3 business days.</p>
      <div class="ctas" style="animation-delay:.4s"><a class="btn" href="/shop">Keep shopping</a><a class="btn ghost" href="/help">Help</a></div>
    </div>
  </section>
</main>
<div data-footer></div>
<script src="/assets/site.js" defer></script>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get("session_id");
  const state = document.getElementById("state");
  if (!id) { state.textContent = "Thank you"; return; }
  try {
    const r = await fetch("https://pursec-shop.pursec-telemetry-hq.workers.dev/order-status?session_id=" + encodeURIComponent(id));
    const d = await r.json();
    if (d.paid) {
      state.textContent = "Payment confirmed";
      const clear = () => window.PURSEC ? window.PURSEC.clearBag() : setTimeout(clear, 100); clear();
    } else {
      state.textContent = "Payment pending";
      document.getElementById("title").textContent = "Almost there.";
      document.getElementById("text").textContent = "We're waiting for your payment to clear. You'll get an email as soon as it does.";
    }
  } catch { state.textContent = "Thank you"; }
})();
</script>
</body>
</html>
