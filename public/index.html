<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PURSEC — Streetwear</title>
<meta name="description" content="PURSEC streetwear. Join the list to hear first.">
<meta name="theme-color" content="#050505">
<meta property="og:type" content="website">
<meta property="og:title" content="PURSEC">
<meta property="og:description" content="PURSEC streetwear. Join the list to hear first.">
<meta property="og:image" content="https://pursec.club/img/brand/og.jpg">

<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"PURSEC","url":"https://pursec.club","logo":"https://pursec.club/img/favicon-512.png","email":"hola@pursec.club"}</script>
</head>
<body data-page="home">
<div data-header></div>

<main id="main">
  <section class="hero" aria-label="PURSEC">
    <div class="center">
      <div class="stage">
        <h1 class="sr">PURSEC</h1>
        <img class="logo" src="/img/brand/pursec-white.svg" width="1612" height="403" alt="" fetchpriority="high">
        <span class="beam" aria-hidden="true"></span>
        <div class="line" aria-hidden="true"></div>
      </div>
      <div class="kicker mono"><span class="dot" aria-hidden="true"></span>Streetwear</div>
      <div class="ctas"><a class="btn" href="#list">Join the list <span class="arrow">→</span></a></div>
    </div>
    <span class="corner l mono">PURSEC</span>
    <span class="corner r mono">2026</span>
  </section>

  <div class="band" aria-hidden="true">
    <div class="marquee">
      <span>PURSEC<i></i>Streetwear<i></i>PURSEC<i></i>Streetwear<i></i>PURSEC<i></i>Streetwear<i></i>PURSEC<i></i>Streetwear<i></i></span>
      <span>PURSEC<i></i>Streetwear<i></i>PURSEC<i></i>Streetwear<i></i>PURSEC<i></i>Streetwear<i></i>PURSEC<i></i>Streetwear<i></i></span>
    </div>
  </div>

  <section class="sec list" id="list" aria-labelledby="list-title">
    <div class="inner">
      <span class="mono accent" data-reveal>The list</span>
      <h2 class="h2" id="list-title" data-reveal style="--d:.05s">Be first<br>in line</h2>
      <p class="mute" data-reveal style="--d:.1s;margin:0;max-width:440px">One email when we open. Nothing else. Leave whenever you want.</p>
      <form data-waitlist="web-home" style="display:contents" novalidate>
        <div class="field" data-reveal style="--d:.15s">
          <label class="sr" for="em">Email</label>
          <input id="em" type="email" required autocomplete="email" placeholder="Your email">
          <button class="btn" type="submit">Join</button>
        </div>
        <label class="consent" data-reveal style="--d:.2s"><input type="checkbox" required><span>I agree to receive emails from PURSEC and accept the <a href="/legal#privacy">privacy policy</a>.</span></label>
        <p class="form-msg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>

<div data-footer></div>
<script src="/assets/site.js" defer></script>
</body>
</html>
